[package]
name = "alkove-python"
description = "The Python package of Alkove: the core and the engine, natively"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_alkove"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
alkove-core = { path = "../crates/core" }
alkove-engine = { path = "../crates/engine" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
