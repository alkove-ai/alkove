[workspace]
members = ["crates/engine", "crates/core", "crates/wasm", "python"]
# the Python extension builds with maturin, against a Python
default-members = ["crates/engine", "crates/core", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alkove-ai/alkove"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
