[workspace]
members = ["crates/engine", "crates/core", "crates/wasm", "python", "android/jni"]
# the Python extension builds with maturin, against a Python; the Android library with cargo-ndk
default-members = ["crates/engine", "crates/core", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/alkove-ai/alkove"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the core runs light loops around the engine: built for size
[profile.release.package.alkove-core]
opt-level = "s"

# the Python wheel: a panic raises in Python instead of ending the interpreter
[profile.python]
inherits = "release"
panic = "unwind"

# the Android library: a panic throws in Kotlin instead of ending the app
[profile.android]
inherits = "release"
panic = "unwind"
