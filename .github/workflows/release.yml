name: release

# a tag per package, published to PyPI by trusted publishing (no token here), one environment per project as PyPI takes a pending publisher once per configuration:
# python-vX.Y.Z the alkove wheels on every target and its sdist; livekit-v, pipecat-v, wyoming-v their integration; esphome-v alkove-esphome, once the release of that tag holds the bundle bundle.json names
on:
  push:
    tags: ['python-v*', 'livekit-v*', 'pipecat-v*', 'wyoming-v*', 'esphome-v*']

permissions:
  contents: read

jobs:
  wheels:
    if: startsWith(github.ref_name, 'python-v')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --profile python --out dist
          manylinux: auto
      - run: pip install python/dist/*.whl pytest
        shell: bash
      - run: cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/python/tests"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  sdist:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz


  alkove:
    if: startsWith(github.ref_name, 'python-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # the integration the tag names, built and checked against the tag's version
  integration:
    if: "!startsWith(github.ref_name, 'python-v')"
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.which.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: which
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - run: pip install build && python -m build "integrations/${{ steps.which.outputs.name }}" -o dist
      - run: ls dist/*-"${GITHUB_REF_NAME##*-v}"-py3-none-any.whl
      - if: steps.which.outputs.name == 'esphome'
        run: |
          b=integrations/esphome/components/alkove_spot/bundle.json
          test "$(jq -r .version "$b")" = "${GITHUB_REF_NAME#esphome-v}"
          gh release download "$GITHUB_REF_NAME" -D bundle
          for k in library model; do
            test "$(sha256sum "bundle/$(jq -r ".$k.file" "$b")" | cut -d' ' -f1)" = "$(jq -r ".$k.sha256" "$b")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: integration
          path: dist/*

  livekit:
    if: needs.integration.outputs.name == 'livekit'
    needs: integration
    runs-on: ubuntu-latest
    environment: pypi-livekit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  pipecat:
    if: needs.integration.outputs.name == 'pipecat'
    needs: integration
    runs-on: ubuntu-latest
    environment: pypi-pipecat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  wyoming:
    if: needs.integration.outputs.name == 'wyoming'
    needs: integration
    runs-on: ubuntu-latest
    environment: pypi-wyoming
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  esphome:
    if: needs.integration.outputs.name == 'esphome'
    needs: integration
    runs-on: ubuntu-latest
    environment: pypi-esphome
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # the GitHub release of an integration's tag, once on PyPI, never Latest
  github:
    needs: [integration, livekit, pipecat, wyoming]
    if: always() && contains(fromJSON('["livekit", "pipecat", "wyoming"]'), needs.integration.outputs.name) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.integration.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          v=${GITHUB_REF_NAME##*-v}
          case $NAME in livekit) title="LiveKit plugin" ;; pipecat) title="Pipecat plugin" ;; wyoming) title="Wyoming server" ;; esac
          read -r pkg range < <(python3 -c "import tomllib; p = tomllib.load(open('integrations/$NAME/pyproject.toml', 'rb'))['project']; print(p['name'], next(d for d in p['dependencies'] if d.startswith('alkove')))")
          printf '[`%s`](https://pypi.org/project/%s/%s/) %s on PyPI, on `%s`.\n\nSee [integrations/%s](https://github.com/%s/tree/%s/integrations/%s).\n' \
            "$pkg" "$pkg" "$v" "$v" "$range" "$NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title $v" --notes-file notes.md --latest=false
