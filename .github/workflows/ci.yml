name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # the engine's tests compare its kernels to plain loops, to the bit: passing on every target means the same bits everywhere
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  # rust-version: what someone building the sdist or the crates needs; we build with rust-toolchain.toml's
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-targets

  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - run: curl -sSf https://wasmtime.dev/install.sh | bash -s -- --version v25.0.0 && echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - run: cargo test --release -p alkove-engine -p alkove-core --target wasm32-wasip1
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - run: cargo test --release -p alkove-engine -p alkove-core --target wasm32-wasip1

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter alkove build
      - run: pnpm --filter alkove check

  # the wheels on every target but Intel macOS, which release.yml builds and tests; the digests of the web SDK once the models can be downloaded
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --profile python --out dist
          manylinux: auto
      - run: cargo clippy --profile python -p alkove-python -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: pip install python/dist/*.whl pytest
        shell: bash
      # outside the source tree: the installed wheel, not python/alkove
      - run: cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/python/tests"
        shell: bash

  # the LiveKit and Pipecat integrations against the versions they are tested with
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --profile python --out dist
          manylinux: auto
      - run: pip install python/dist/*.whl "livekit-agents==1.8.8" "pipecat-ai==1.13.0" pytest
      - run: pip install --no-deps -e integrations/livekit -e integrations/pipecat
      - run: python -m pytest -q integrations/livekit/tests integrations/pipecat/tests

  # the Android library: its binding, its tests on the host JVM (the web's digests once the models can be downloaded), the AARs and the example minified (R8 against the consumer rules)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo clippy --profile android -p alkove-android --all-targets -- -D warnings
      - run: cargo test -p alkove-android
      - run: ./gradlew --no-daemon :alkove:testDebugUnitTest :livekit:testDebugUnitTest :alkove:assembleRelease :livekit:assembleRelease :example:assembleRelease
        working-directory: android
