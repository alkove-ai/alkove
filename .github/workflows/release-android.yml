name: release-android

# a tag android-vX.Y.Z: the AARs built and tested, their Maven tree to maven.alkove.ai (an R2 bucket, through its S3 API);
# credentials in the environment maven: secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, variable R2_BUCKET
on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    environment: maven
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: ${{ secrets.R2_ENDPOINT }}
      BUCKET: s3://${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: the tag is the version in gradle.properties
        run: test "${GITHUB_REF_NAME#android-v}" = "$(sed -n 's/^version=//p' android/gradle.properties)"
      # absent is a 404; anything else (credentials, network) stops the release
      - name: a published version is never replaced
        run: |
          v="${GITHUB_REF_NAME#android-v}"
          for a in alkove alkove-livekit; do
            if aws s3api head-object --endpoint-url "$R2" --bucket "${BUCKET#s3://}" --key "ai/alkove/$a/$v/$a-$v.pom" > /dev/null 2> err; then echo "$a $v is already on maven.alkove.ai"; exit 1; fi
            grep -q -E "404|Not Found" err || { cat err; exit 1; }
          done
      # Gradle adds the new version to the metadata it finds: the versions already out stay listed
      - name: the metadata already published
        run: |
          for a in alkove alkove-livekit; do
            mkdir -p "android/build/maven/ai/alkove/$a"
            key="ai/alkove/$a/maven-metadata.xml"
            if aws s3api head-object --endpoint-url "$R2" --bucket "${BUCKET#s3://}" --key "$key" > /dev/null 2> err; then
              aws s3 cp --endpoint-url "$R2" "$BUCKET/$key" "android/build/maven/ai/alkove/$a/"
            else
              grep -q -E "404|Not Found" err || { cat err; exit 1; }
            fi
          done
      - run: ./gradlew --no-daemon :alkove:testDebugUnitTest :livekit:testDebugUnitTest publishAllPublicationsToStagingRepository
        working-directory: android
      - run: aws s3 sync --endpoint-url "$R2" android/build/maven "$BUCKET"
