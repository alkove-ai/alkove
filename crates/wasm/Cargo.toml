[package]
name = "alkove-wasm"
description = "C ABI of the Alkove engine and core: the wasm module of the web SDK, and a native library for other languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alkove-engine = { path = "../engine" }
alkove-core = { path = "../core" }

[features]
# exports for the tests that compare the core to the TypeScript it replaces, piece by piece
harness = []
